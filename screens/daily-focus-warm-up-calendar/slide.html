<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Afternoon Focus Warm-Up — full-screen slide</title><link rel="canonical" href="https://honestlittleapps.github.io/screens/daily-focus-warm-up-calendar/"><style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;overflow:hidden}
body{background:radial-gradient(circle at 25% 15%,#1d5fbf,#0d2a55 75%);color:#fff;display:flex;flex-direction:column}
body.light{background:#fbf8f2;color:#1d1d1f}
.top{display:flex;justify-content:space-between;padding:3.5vh 4vw 0;font-size:2.6vh;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 7vw}
h1{font-size:min(7.5vh,5.5vw);line-height:1.12;margin:0 0 3vh;font-weight:780}
.b{font-size:min(4.1vh,3vw);line-height:1.4;white-space:pre-line;max-width:85vw;opacity:.95}
.hid{margin-top:2vh;font-size:2.8vh;opacity:.75;font-style:italic}
.foot{display:flex;align-items:center;gap:2vw;padding:0 4vw 3.5vh;font-size:2.3vh;opacity:.9}
.foot img{width:12vh;height:12vh;background:#fff;padding:.6vh;border-radius:1.2vh}
.foot .s{margin-left:auto;text-align:right;opacity:.8}
</style></head><body><div class="top"><span id="label">Afternoon Focus Warm-Up</span><span id="date"></span></div><main><h1 id="t">Loading…</h1><div class="b" id="b"></div><div class="hid" id="hid"></div></main>
<div class="foot"><img src="https://honestlittleapps.github.io/screens/daily-focus-warm-up-calendar/qr.png" alt="QR code"><div><b>SkillArena: Focus Training</b><br>Free on the App Store · scan for more</div><div class="s">Free screen from<br>honestlittleapps.github.io/screens</div></div>
<script>
const KEY="daily-focus-warm-up-calendar", CITIES={}; const P=new URLSearchParams(location.search);
if(P.get('theme')==='light')document.body.classList.add('light');
const key=(P.get('city')&&CITIES[P.get('city')])||KEY;
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tmin(s){const m=/(\d+):(\d+) ?(AM|PM)/.exec(s||'');if(!m)return -1;let h=+m[1]%12;if(m[3]==='PM')h+=12;return h*60+ +m[2]}
async function draw(){try{const r=await fetch('https://honestlittleapps.github.io/data/'+key+'.json',{cache:'no-store'});const d=await r.json();const now=new Date(),today=ymd(now),mins=now.getHours()*60+now.getMinutes();
let todays=d.items.filter(x=>x.d===today);let it=null;
if(todays.length){const timed=todays.filter(x=>x.tm);if(timed.length){it=timed.filter(x=>tmin(x.tm)<=mins).pop()||timed[0]}else it=todays[0]}
else{it=d.items.find(x=>x.d>today);if(it)document.getElementById('label').textContent='Afternoon Focus Warm-Up · coming up '+new Date(it.d+'T12:00').toLocaleDateString(undefined,{month:'long',day:'numeric'})}
if(!it){document.getElementById('t').textContent='See you soon';return}
let body=it.b;{const f=body.split('\n')[0].trim().replace(/\.$/,'');if(f===it.t.trim().replace(/\.$/,''))body=body.slice(body.indexOf('\n')+1)}body=body.replace(/\n\s*(From |Free on the App Store|https?:).*/s,'');const m=body.search(/\n\s*(Answer|Answers|One answer):/);let hid='';
if(m>0&&it.d===today&&mins<14*60){body=body.slice(0,m);hid='Answer revealed at 2 PM. Think it over!'}
document.getElementById('t').textContent=it.t;document.getElementById('b').textContent=body.trim();document.getElementById('hid').textContent=hid;
document.getElementById('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
const fit=()=>{const b=document.getElementById('b');let s=parseFloat(getComputedStyle(b).fontSize);while(document.body.scrollHeight>innerHeight+2&&s>12){s-=1;b.style.fontSize=s+'px'}};fit();
}catch(e){document.getElementById('t').textContent='Reconnecting…'}}
draw();setInterval(draw,15*60*1000);
</script></body></html>
